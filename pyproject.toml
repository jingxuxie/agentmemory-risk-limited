[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "risk-memory"
version = "0.1.0"
description = "Synthetic validation of sharp risk-limited memory revalidation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
[tool.setuptools.packages.find]
include = ["risk_memory*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
